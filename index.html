<style>
:root{
  /* layout: 학생=모바일 1열 카드(태블릿 2열), 선생님=넓은 작업 보드. 몬스터가 항상 첫 화면의 주인공 */
  --lav:#B8A7E8; --mint:#B9E4D0; --cream:#FFF9EE; --coral:#F5A995; --navy:#28314B;
  --lav-deep:#6A54B8; --mint-deep:#2F7D59; --coral-deep:#B4543C; --gold:#B08A3E;
  --ink:#28314B; --muted:#6B7391; --card:#FFFFFF; --line:#EDE5D6; --soft:#F6F1FF;
  --display:'Fraunces','IBM Plex Sans KR',serif; --body:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav-deep);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px}
.wrap.s{max-width:920px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.brand span{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{border-color:var(--lav)}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:#1c2338}
.btn.l{background:var(--lav-deep);border-color:var(--lav-deep);color:#fff}
.btn.g{background:transparent}
.btn.d{color:var(--coral-deep);border-color:#F3CFC4}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
body.busy [data-act]{pointer-events:none;opacity:.7}
.demo{background:var(--navy);color:#fff;font-size:12.5px;padding:8px 16px;text-align:center}
.demo b{color:var(--mint)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
@media(min-width:780px){.g2{grid-template-columns:1.05fr .95fr;align-items:start}}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)} .tiny{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--lav-deep);white-space:nowrap}
.pill.ok{background:#E3F5EB;color:var(--mint-deep)} .pill.wait{background:#FFF0D9;color:#8A5A12}
.pill.no{background:#FDE9E3;color:var(--coral-deep)} .pill.rare{background:#F6ECD3;color:#7B5C1B} .pill.gray{background:#EFEDE8;color:var(--muted)}

/* hero */
.hero{position:relative;border-radius:26px;padding:18px 18px 20px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 50% 0%,#3B4677 0%,#242B4A 58%,#181D33 100%);border:1px solid #2E365A}
.hero::before{content:"";position:absolute;inset:auto -10% -42% -10%;height:62%;background:radial-gradient(closest-side,#8F7BE055,#8F7BE000);pointer-events:none}
.hero .pill{background:#ffffff1f;color:#fff}.hero .lv{background:#323B66;border:1px solid #ffffff2e}.hero .bar{background:#ffffff1a;border-color:#ffffff33}.hero .next{background:#ffffff14;color:#fff}.hero .mname span{color:#C9BCF5}
.hero .stars i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.lv{background:var(--navy);color:#fff;border-radius:14px;padding:6px 12px;text-align:center;line-height:1}
.lv small{display:block;font-size:10px;letter-spacing:.18em;opacity:.75;margin-bottom:3px}
.lv b{font-family:var(--display);font-size:26px}
.mon{width:min(62vw,250px);margin:2px auto 0;display:block;position:relative;animation:float 4s ease-in-out infinite}
.mon svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 10px #28314b22)}
@keyframes float{50%{transform:translateY(-7px)}}
.mname{text-align:center;position:relative}
.mname b{font-size:22px;font-weight:700}
.mname span{display:block;font-size:12px;letter-spacing:.16em;color:var(--lav-deep);font-weight:700}
.xp{margin-top:12px;position:relative}
.bar{height:14px;border-radius:999px;background:#fff;border:1px solid #D5CCEE;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lav-deep),var(--lav) 60%,var(--coral));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xp-row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;font-weight:600}
.next{margin-top:10px;background:#ffffffb8;border-radius:14px;padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;position:relative}

/* evolution */
.hero .next.evok{width:100%;border:1px solid #FFD27A;background:#FFD27A2b;color:#fff;cursor:pointer;font:inherit;text-align:left}
.stones{position:relative;display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:12.5px;opacity:.9}

/* stats */
.stat{margin-top:10px}.stat:first-of-type{margin-top:0}.stat-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}.bar.sm{height:9px}

/* map */
.wmap{width:100%;max-width:560px;height:auto;display:block;margin:0 auto;border-radius:16px}
.wmap .zl{font-family:var(--display);font-size:14px;font-weight:700;fill:#28314B;paint-order:stroke;stroke:#FFF8E7;stroke-width:4px;stroke-linejoin:round}
.wmap .zk{font-size:10.5px;font-weight:600;fill:#4A4033;paint-order:stroke;stroke:#FFF8E7;stroke-width:3px;stroke-linejoin:round}
.wmap .mk{cursor:pointer}.wmap .mkn{font-size:9.5px;font-weight:700;fill:#28314B;paint-order:stroke;stroke:#FFF8E7;stroke-width:3px;stroke-linejoin:round}
.wmap .mkme{font-size:10.5px;font-weight:700;fill:#fff}

/* missions */
.mi{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.mi:first-of-type{border-top:0}
.chip{background:#EEF0F4;flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--navy)}
.a-vocab{background:#E7DFFB}.a-syntax{background:#D6EFE3}.a-grammar{background:#FDE3DA}.a-writing{background:#FBEBC8}.a-homework{background:#E3E8F5}.a-bookwriting{background:#F7E1EC}.a-bookquiz{background:#E2F0D9}.a-attend{background:#DDF2E4}.a-late{background:#FBE0DC}.a-good{background:#E1F0FA}.a-bad{background:#F9D6D6}.a-textbook{background:#FFF0C9}.a-book_reading{background:#DCEBFA}.a-book_syntax{background:#D6EFE3}.a-book_grammar{background:#FDE3DA}.a-book_writing{background:#FBEBC8}.a-book_vocab{background:#E7DFFB}.a-praise{background:#FCE7F3}.a-ar{background:#D8ECF3}.a-nelt{background:#E4E0F7}
#actRows .inp,#zoneRows .inp,#srRows .inp{min-height:36px;padding:6px 10px}#actRows td,#zoneRows td,#srRows td{vertical-align:middle}.a-challenge{background:var(--navy);color:#fff}.a-reading{background:#DDEFF6}
.mi .t{flex:1;min-width:0}
.mi .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.mi .t span{font-size:12.5px;color:var(--muted)}
.xpv{font-family:var(--display);font-weight:700;color:var(--lav-deep);white-space:nowrap}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13.5px;text-align:center}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11.5px;color:var(--muted)}
.week i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--lav);min-height:4px}
.week .today i{background:var(--lav-deep)} .week .today{color:var(--ink);font-weight:700}
.week em{font-style:normal;font-size:11px;font-family:var(--display);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--cream);border-radius:14px;padding:10px;text-align:center}
.kpi b{font-family:var(--display);font-size:20px;display:block}
.kpi span{font-size:11.5px;color:var(--muted)}

/* badges / stage track */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:7px 12px 7px 8px;font-size:13px;font-weight:600}
.badge i{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 20deg,var(--lav),var(--mint),var(--coral),var(--lav));display:grid;place-items:center}
.badge i::after{content:"";width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.badge.off{opacity:.45;border-style:dashed}.badge.off i{background:#E6E2DA}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.track div{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-top:12px;border-top:4px solid var(--line)}
.track .done{border-color:var(--mint)} .track .now{border-color:var(--navy);color:var(--ink)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf8f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:150px;border:0;background:transparent;border-radius:14px;padding:9px 6px;font-weight:600;color:var(--muted);font-size:13.5px;position:relative}
.tabs button.on{background:var(--navy);color:#fff}
.tabs .dot{position:absolute;top:5px;right:16%;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--navy);font-size:11px;display:grid;place-items:center;padding:0 4px}

/* dex */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.dx{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:center;width:100%}
.dx svg{width:100%;height:auto;max-width:130px}
.dx b{display:block;font-family:var(--display);letter-spacing:.06em}
.dx.on{border-color:var(--lav-deep);box-shadow:0 0 0 2px #B8A7E855}
.sil svg{filter:brightness(0) opacity(.16)}
/* 도감: 67가문 × 3단계 */
.pill.epic{background:#E9E3FA;color:#4B3A94}.pill.legend{background:#28314B;color:#F3DFA8}
.el{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}.el i{width:8px;height:8px;border-radius:50%}
.dno{font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.dexbar{height:8px;border-radius:99px;background:#EFE9DC;overflow:hidden;margin-top:8px}.dexbar i{display:block;height:100%;background:var(--lav-deep);border-radius:99px}
.fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fam{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:left;width:100%;display:grid;gap:8px;color:inherit;content-visibility:auto;contain-intrinsic-size:auto 200px}
.fam.on{border-color:var(--lav-deep);box-shadow:0 0 0 2px #B8A7E855}.fam.can{border-color:var(--coral-deep);box-shadow:0 0 0 2px #F5A99555}
.fam .fh{display:flex;align-items:center;gap:6px;min-width:0}.fam .fh b{font-family:var(--display);letter-spacing:.06em;white-space:nowrap}.fam .fh .sp{flex:1}.fam .fh .tiny{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fm{background:var(--cream);border-radius:12px;padding:6px 4px;text-align:center;font-size:11px;color:var(--muted);display:grid;gap:1px;min-width:0}
.fm svg{width:100%;height:auto;max-width:84px;margin:0 auto}.fm b{font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fm.sil svg{filter:brightness(0) opacity(.16)}.fm.sil b{opacity:.45}
.fm.nx{background:#FFF1EC;box-shadow:inset 0 0 0 1.5px var(--coral)}.fm.nx svg{filter:brightness(0) opacity(.34)}.fm.nx b{color:var(--coral-deep)}
.fam .ff{display:flex;align-items:center;gap:6px;justify-content:space-between;font-size:12.5px;color:var(--muted);min-height:22px}.fam .ff span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dal{display:grid;gap:8px}
.dar{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;width:100%;text-align:left;color:inherit;content-visibility:auto;contain-intrinsic-size:auto 66px}.dar[hidden]{display:none}
.dar .t{flex:1;min-width:0;display:grid;gap:2px}.dar .t b{font-family:var(--display);letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dar .t b i{font-style:normal;font-family:var(--body);letter-spacing:0;font-weight:400;font-size:12.5px;color:var(--muted)}.dar .t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dar .th{display:flex;gap:4px;flex:none}.dar .th div{width:42px;height:42px;border-radius:10px;background:var(--cream)}.dar .th svg{width:100%;height:100%}
.dar .th div.ph{outline:1.5px dashed #D8CDB8;outline-offset:-1.5px}.dar .th div.ph svg{opacity:.4}
.dae{display:flex;gap:12px;align-items:center}.dae .pv{width:112px;height:112px;border-radius:16px;background:repeating-conic-gradient(#F1ECE0 0 25%,#FBF7EE 0 50%) 0 0/16px 16px;flex:none}.dae .pv svg,.dae .pv img{width:100%;height:100%;object-fit:contain;display:block}
textarea.inp{min-height:64px;resize:vertical;font-family:inherit;font-size:14px;line-height:1.5}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:12px;font-weight:600}
.forms svg{width:100%;height:auto}
.egg{animation:wob 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:11.5px;color:var(--muted);font-weight:600}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;gap:1px}
.cal .d em{font-style:normal;font-size:10.5px;font-family:var(--display);font-weight:700}
.cal .x1{background:#E9E2FB}.cal .x2{background:#CFC2F2}.cal .x3{background:var(--lav-deep);color:#fff}
.cal .td{outline:2px solid var(--navy)}

/* forms & tables */
.field{display:grid;gap:5px;font-size:13px;font-weight:600}
.field input,.field select,.inp{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:42px;width:100%;font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.sel td{background:#F6F1FF}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--lav-deep)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ck{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;min-height:40px}
.ck.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ttabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px}
.ttabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;white-space:nowrap;min-height:40px}
.ttabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ttabs em{font-style:normal;background:var(--coral);color:var(--navy);border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.st{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:18px;padding:10px 12px;text-align:left;width:100%}
.st svg{width:58px;height:58px;flex:none}
.st>span>b:first-child{display:block}
.note{background:#F3F7F4;border:1px solid #D9EADF;border-radius:14px;padding:10px 12px;font-size:13px;color:#2D5743}

/* modal / toast */
.ov{position:fixed;inset:0;background:#28314b99;display:grid;place-items:end center;z-index:50;padding:0}
.sheet{background:var(--cream);border-radius:24px 24px 0 0;width:min(100%,640px);max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{place-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:80;max-width:90vw;box-shadow:0 8px 24px #28314b40}
.toast.err{background:var(--coral-deep)}

/* login / starter */
.login{max-width:440px;margin:0 auto;padding:36px 16px 60px;display:grid;gap:16px}
.logo{text-align:center}
.logo h1{font-family:var(--display);font-size:34px;letter-spacing:.03em;line-height:1.05}
.logo p{letter-spacing:.34em;font-size:11px;font-weight:700;color:var(--lav-deep);margin-top:8px}
.trio{display:flex;justify-content:center;margin:6px 0 -6px}
.trio svg{width:31%;max-width:130px;height:auto}
.starters{display:grid;gap:12px}
@media(min-width:680px){.starters{grid-template-columns:repeat(3,1fr)}}

function imgPrep(file,size){return new Promise((ok,no)=>{if(!/^image\/(png|webp)$/.test(file.type))return no(new Error('배경이 투명한 PNG 파일을 골라 주세요.'));const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,size/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),h=Math.max(1,Math.round(im.height*k)),side=Math.max(w,h),c=document.createElement('canvas');c.width=c.height=side;c.getContext('2d').drawImage(im,(side-w)/2,(side-h)/2,w,h);

  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('열 수 없는 이미지입니다.'))};im.src=u})}

function reveal({oldSvg,newSvg,title,sub}){return new Promise(res=>{
  const fx=$('#fx');let pts='';for(let i=0;i<26;i++)pts+=`<i class="pt${i%3===0?' s':''}" style="--a:${Math.round(360/26*i)}deg;--d:${110+Math.round(Math.random()*90)}px;animation-delay:${(Math.random()*1.8).toFixed(2)}s"></i>`;
  fx.innerHTML=`<div class="evo"><div class="ring"></div><div class="box"><div class="m old">${oldSvg}</div><div class="m new">${newSvg}</div>${pts}</div>
   <button class="skip" id="evskip">건너뛰기</button>
   <div class="txt"><h2>${esc(title)}</h2><p>${sub}</p><button class="btn" id="evok" style="color:#28314B">계속하기</button></div></div>`;
  const el=fx.firstChild,done=()=>el.classList.add('done');
  const tm=setTimeout(done,4300);
  $('#evskip').onclick=()=>{clearTimeout(tm);done()};
  $('#evok').onclick=()=>{clearTimeout(tm);fx.innerHTML='';res()};
})}

  async logout(){await this.sb.auth.signOut()},
  async signUp(client,id,pw,name,ac){ac=this.ac(ac);if(!/^[a-z0-9]{3,20}$/.test(id))throw new Error('아이디는 영문 소문자·숫자 3~20자로 만들어 주세요.');if((pw||'').length<6)throw new Error('비밀번호는 6자 이상이어야 합니다.');
    const{data,error}=await client.auth.signUp({email:this.mail(id,ac),password:pw,options:{data:{mw:'true',display_name:name,academy:ac}}});
    if(error)throw new Error(/registered/i.test(error.message)?'이미 있는 아이디입니다.':error.message);if(!data.user||(data.user.identities&&!data.user.identities.length))throw new Error('이미 있는 아이디입니다.');return data.user.id},
  async signupTeacher(id,pw,name,code,ac){await this.signUp(this.sb,id,pw,name,ac);const{data}=await this.sb.auth.getSession();if(!data.session)await this.login(id,pw,ac);try{localStorage.setItem('mw_academy',this.ac(ac))}catch(e){}await this.rpc('claim_teacher',{code,name})},
  async createStudent(id,pw,name){const tmp=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'mw-tmp-'+Date.now()}});
    const uid=await this.signUp(tmp,id,pw,name,W.academy.code);await this.rpc('activate_student',{id:uid,name,active:true})},
  async rpc(n,a){const p={};for(const k in(a||{}))p['p_'+k]=a[k]===undefined?null:a[k];const{data,error}=await this.sb.rpc('mw_'+n,p);if(error)throw new Error(error.message);return data},
  async weekly(start){return this.rpc('weekly',{start})},
  // 몬스터 이미지: 저장소(mw-monsters)에 큰 이미지·작은 이미지를 올리고 주소를 돌려줍니다. 도감에 연결하는 것은 mw_species_save 가 합니다.
  async putImage(id,st,full,thumb){const b=this.sb.storage.from('mw-monsters'),t=Date.now().toString(36),up=async(blob,sfx)=>{const path=`${id}_${st}_${t}${sfx}.${blob.type==='image/webp'?'webp':'png'}`;
    const{error}=await b.upload(path,blob,{contentType:blob.type,cacheControl:'31536000'});if(error)throw new Error('이미지를 올리지 못했습니다. ('+error.message+')');return b.getPublicUrl(path).data.publicUrl};
    return{image_url:await up(full,''),thumb_url:await up(thumb,'t')}},
  async q(b){const{data,error}=await b;if(error)throw new Error(error.message);return data||[]},
  async load(){const uid=await this.session();if(!uid)return null;const sb=this.sb;
    const profiles=await this.q(sb.from('mw_profiles').select('*'));const me=profiles.find(p=>p.id===uid);if(!me)return{me:null};
    const T=me.role==='teacher'&&me.active,t0=new Date();t0.setHours(0,0,0,0);
    const[acs,species,sets,monsters,missions,ledger,books,badges,rewards,summary]=await Promise.all([
      this.q(sb.from('mw_academies').select('*')),
      this.q(sb.from('mw_species').select('*').eq('enabled',true).order('sort')),this.q(sb.from('mw_settings').select('*')),
      this.q(sb.from('mw_monsters').select('*').limit(5000)),
      this.q(T?sb.from('mw_missions').select('*').or('status.in.(assigned,requested,rejected),decided_at.gte.'+t0.toISOString()).order('created_at',{ascending:false}).limit(1000)
              :sb.from('mw_missions').select('*').order('created_at',{ascending:false}).limit(300)),
      this.q(sb.from('mw_ledger').select('*').order('created_at',{ascending:false}).limit(T?300:1000)),
      this.q(T?sb.from('mw_books').select('*').eq('status','requested').limit(1000):sb.from('mw_books').select('*').limit(1000)),
      T?[]:this.q(sb.from('mw_badges').select('*')),T?[]:this.q(sb.from('mw_rewards').select('*')),
      T?this.rpc('summary'):[]]);
    const set=JSON.parse(JSON.stringify(DEF_SET));for(const r of sets.filter(r=>!r.academy_id))set[r.key]=r.value;for(const r of sets.filter(r=>r.academy_id))set[r.key]=r.value;set.activity_xp={...DEF_SET.activity_xp,...set.activity_xp};
    return{me,academy:acs[0]||null,profiles,species,set,monsters,missions,ledger,books,badges,rewards,summary:summary||[]}},
  async loadStudent(id){const sb=this.sb;const[missions,ledger,books,badges]=await Promise.all([
    this.q(sb.from('mw_missions').select('*').eq('student_id',id).order('created_at',{ascending:false}).limit(50)),
    this.q(sb.from('mw_ledger').select('*').eq('student_id',id).order('created_at',{ascending:false}).limit(100)),
    this.q(sb.from('mw_books').select('*').eq('student_id',id).limit(1000)),this.q(sb.from('mw_badges').select('*').eq('student_id',id))]);return{missions,ledger,books,badges}}
};

function evoOpts(m){const sp=m&&spOf(m.species_id),need=sp?reqLv(sp,m.stage+1):null,b=W.stones||{},o=[];if(!m||m.stage>=3||need==null||m.level<need)return o;
  if(m.stage===1){if((b.evo||0)>=1)o.push(['evo','진화석 1개']);if((b.legend||0)>=1)o.push(['legend','전설석 1개'])}else{if((b.legend||0)>=1)o.push(['legend','전설석 1개']);if((b.evo||0)>=2)o.push(['evo2','진화석 2개'])}return o}
function stoneHint(kind){const S=W.set.activity_stones||{},a=Object.keys(S).filter(k=>S[k]===kind&&ACT[k]).map(k=>ACT[k][1]);return a.length?a.join(', '):'선생님이 정한 활동'}
function evoBox(m){const set=W.set,sp=spOf(m.species_id),need=sp?reqLv(sp,m.stage+1):null,mx=m.level>=set.max_level;
  if(m.stage>=3||need==null)return `<div class="next"><span>진화</span><b>${mx?'최고 레벨 달성 · 새 알을 부화해 보세요':'Legend 달성 · Lv.'+set.max_level+' 도전'}</b></div>`;
  if(m.level<need)return `<div class="next"><span>다음 진화</span><b>Lv.${need} ${STN[m.stage+1]} · ${need-m.level}레벨 남음</b></div>`;
  if(evoOpts(m).length)return `<button class="next evok" data-act="evoOpen" data-id="${m.id}"><span>${STN[m.stage+1]} 진화 가능</span><b>진화시키기 →</b></button>`;

function statCard(){const st=W.stats||{},R=(W.set.stat_rewards||[]);

function dexHint(s){if(s.rarity==='starter')return '처음 선택';if(s.rarity==='seasonal')return '시즌 이벤트 보상';const r=(W.set.stat_rewards||[]).find(x=>x.species===s.id);

/* 학생 도감: 가문마다 세 형태를 보여 줍니다. 얻은 형태는 색으로, 아직 못 얻은 형태는 실루엣으로, 지금 진화할 수 있으면 '진화 가능'으로 표시 */
function viewDex(){const me=W.me,S=W.species,own=Object.fromEntries(W.monsters.map(m=>[m.species_id,m])),F=UI.dexF||'all',E=UI.dexE||'';
  const st=Object.fromEntries(S.map(s=>{const o=own[s.id];return[s.id,!o?'none':!o.hatched?'egg':evoOpts(o).length?'evo':'own']}));
  const hm=W.monsters.filter(m=>m.hatched&&spOf(m.species_id)),total=S.length*3,got=hm.reduce((n,m)=>n+Math.min(3,Math.max(1,m.stage)),0);
  const cnt={all:S.length,own:S.filter(s=>st[s.id]!=='none').length,evo:S.filter(s=>st[s.id]==='evo').length,none:S.filter(s=>st[s.id]==='none').length};

  const els=Object.keys(ELEM).filter(e=>S.some(s=>s.element===e));

    if(k==='none')return `<div class="fam"><div class="fh">${no}<b style="opacity:.4">? ? ?</b><span class="sp"></span>${tags}</div><div class="f3">${[1,2,3].map(t=>sil(s,t,formId(s,t))).join('')}</div><div class="ff"><span>미획득</span><span>${dexHint(s)}</span></div></div>`;
    if(k==='egg')return `<button class="fam can" data-act="hatch" data-id="${o.id}"><div class="fh">${no}<b>? ? ?</b><span class="sp"></span>${tags}</div><div class="f3"><div class="fm"><div class="egg">${eggSVG(null)}</div><b>알</b><span>${formId(s,1)}</span></div>${[2,3].map(t=>sil(s,t,formId(s,t))).join('')}</div><div class="ff"><span>${esc(o.source||'새 알')}</span><span class="pill wait">부화하기</span></div></button>`;
    const can=k==='evo',act=o.id===me.active_monster;
    return `<button class="fam ${act?'on':''} ${can?'can':''}" data-act="dexOpen" data-id="${o.id}"><div class="fh">${no}<b>${esc(s.name)}</b><span class="tiny muted">${esc(s.name_ko||'')}</span><span class="sp"></span>${tags}</div>
      <div class="f3">${[1,2,3].map(t=>t<=o.stage?`<div class="fm">${monsterSVG(s,t,{thumb:1})}<b>${STN[t]}</b><span>${formId(s,t)}</span></div>`:t===o.stage+1&&can?`<div class="fm nx">${monsterSVG(s,t,{thumb:1})}<b>진화 가능</b><span>${formId(s,t)}</span></div>`:sil(s,t,'Lv.'+reqLv(s,t))).join('')}</div>
      <div class="ff"><span>${esc(o.nickname||formName(s,o.stage))} · Lv.${o.level}</span>${can?'<span class="pill no">진화 가능</span>':act?'<span class="pill">대표 몬스터</span>':''}</div></button>`};
  return `<div class="stack"><div><h2 style="font-size:20px">몬스터 도감</h2><p class="muted">발견 <b class="num">${got}</b> / ${total} · 가문 <b class="num">${hm.length}</b> / ${S.length}</p><div class="dexbar"><i style="width:${total?Math.max(got?2:0,got/total*100).toFixed(1):0}%"></i></div></div>
    <div class="row" style="gap:6px">${[['all','전체'],['own','획득'],['evo','진화 가능'],['none','미획득']].map(([k,l])=>`<button class="ck ${F===k?'on':''}" data-act="dexF" data-v="${k}">${l} ${cnt[k]}</button>`).join('')}
      ${els.length?`<select class="inp" id="dexE" aria-label="속성" style="width:auto;min-height:40px;padding:6px 10px"><option value="">모든 속성</option>${els.map(e=>`<option value="${e}" ${E===e?'selected':''}>${ELEM[e][0]}</option>`).join('')}</select>`:''}</div>
    ${list.length?`<div class="fams">${list.map(card).join('')}</div>`:'<div class="empty">여기에 해당하는 몬스터가 아직 없습니다.</div>'}
    <p class="tiny muted">검은 그림자는 아직 만나지 못한 모습입니다. 새 몬스터는 스탯 목표와 최고 레벨을 달성하면 얻습니다. 뽑기나 구매는 없습니다.</p></div>`}
function streakCard(){const S=W.streaks||{},rows=Object.entries(S).filter(([a,v])=>ACT[a]&&v&&v.days>=2);if(!rows.length)return '';const wd=new Date().getDay(),weekend=wd===0||wd===6;
  return `<section class="card"><h3>연속 기록 <small>평일만 셉니다 · 주말은 쉬어도 이어집니다</small></h3>${rows.map(([a,v])=>{const k=v.len%v.days,left=v.days-k,st=STONE[v.stone]||STONE.evo,nm=esc(ACT[a][1].replace(' 학습','').replace(' 완료',''));
    const msg=v.len===0?'오늘 하면 1일째가 시작됩니다.':k===0?`${v.days}일 연속 달성! ${st[1]} ${st[0]}을 받았습니다. 다음 ${st[0]}까지 ${v.days}일`:`${left}일 더 하면 ${st[1]} ${st[0]} 1개`;
    const tip=weekend?'':v.today?'오늘 완료':`오늘 아직 · 하면 ${v.len+1}일째`;
    return `<div class="stack" style="gap:6px"><div class="row" style="justify-content:space-between"><b>🔥 ${nm} <span class="num">${v.len}</span>일째</b><span class="pill ${v.today?'ok':'gray'}">${tip||'주말'}</span></div>
      <div class="row" style="gap:5px" aria-label="${v.days}일 중 ${k===0&&v.len>0?v.days:k}일">${[...Array(v.days)].map((_,i)=>`<i style="flex:1;height:8px;border-radius:4px;background:${i<(k===0&&v.len>0?v.days:k)?'#E8A93A':'#E3E6F0'}"></i>`).join('')}</div>

  const body=kind==='android'?'<span>한 번 누르면 앱처럼 아이콘으로 바로 열 수 있어요.</span><div class="row"><button class="btn g" data-a2="off">닫기</button><button class="btn p" data-a2="install">홈 화면에 추가</button></div>'
    :kind==='inapp'?'<span>이 앱 안에서는 추가가 안 돼요. 오른쪽 위(또는 아래) <b>⋯ 메뉴</b> → <b>다른 브라우저로 열기</b>를 눌러 주세요.</span><div class="row"><button class="btn g" data-a2="off">닫기</button></div>'
    :`<span>${/CriOS/.test(ua)?'주소창 오른쪽 <b>공유 버튼</b>':'화면 아래 <b>공유 버튼</b>(네모에 위 화살표, 안 보이면 <b>⋯</b>부터)'} → <b>홈 화면에 추가</b> → <b>추가</b></span><div class="row"><button class="btn g" data-a2="off">닫기</button></div>`;
  d.innerHTML='<b>📲 홈 화면에 MONSTER WORLD 추가</b>'+body;document.body.appendChild(d);
  d.addEventListener('click',async e=>{const a=e.target.closest('[data-a2]');if(!a)return;
    if(a.dataset.a2==='install'&&A2HS.ev){const ev=A2HS.ev;A2HS.ev=null;ev.prompt();try{const r=await ev.userChoice;if(r&&r.outcome==='accepted'){d.remove();toast('홈 화면에 추가했어요.')}}catch(_){}}
    else{try{localStorage.setItem('mw_a2hs_off','1')}catch(_){}d.remove()}})}
(function(){try{const ua=navigator.userAgent||'';if(a2hsStandalone())return;
  if(/KAKAOTALK/i.test(ua)&&!sessionStorage.getItem('mw_kakao_out')){sessionStorage.setItem('mw_kakao_out','1');location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(location.href);setTimeout(()=>a2hsShow('inapp'),1500);return}
  if(/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps/i.test(ua)){setTimeout(()=>a2hsShow('inapp'),1200);return}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();A2HS.ev=e;a2hsShow('android')});
  addEventListener('appinstalled',()=>{const d=document.getElementById('a2hs');if(d)d.remove()});
  if(/iPhone|iPad|iPod/.test(ua))setTimeout(()=>a2hsShow('ios'),1200);
}catch(e){}})();
