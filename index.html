<style>
:root{
  /* layout: 학생=모바일 1열 카드(태블릿 2열), 선생님=넓은 작업 보드. 몬스터가 항상 첫 화면의 주인공 */
  --lav:#B8A7E8; --mint:#B9E4D0; --cream:#FFF9EE; --coral:#F5A995; --navy:#28314B;
  --lav-deep:#6A54B8; --mint-deep:#2F7D59; --coral-deep:#B4543C; --gold:#B08A3E;
  --ink:#28314B; --muted:#6B7391; --card:#FFFFFF; --line:#EDE5D6; --soft:#F6F1FF;
  --display:'Fraunces','IBM Plex Sans KR',serif; --body:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lav-deep);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px}
.wrap.s{max-width:920px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-size:18px;letter-spacing:.04em}
.brand span{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{border-color:var(--lav)}
.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.p:hover{background:#1c2338}
.btn.l{background:var(--lav-deep);border-color:var(--lav-deep);color:#fff}
.btn.g{background:transparent}
.btn.d{color:var(--coral-deep);border-color:#F3CFC4}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
body.busy [data-act]{pointer-events:none;opacity:.7}
.demo{background:var(--navy);color:#fff;font-size:12.5px;padding:8px 16px;text-align:center}
.demo b{color:var(--mint)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.card h3{font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
@media(min-width:780px){.g2{grid-template-columns:1.05fr .95fr;align-items:start}}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)} .tiny{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--lav-deep);white-space:nowrap}
.pill.ok{background:#E3F5EB;color:var(--mint-deep)} .pill.wait{background:#FFF0D9;color:#8A5A12}
.pill.no{background:#FDE9E3;color:var(--coral-deep)} .pill.rare{background:#F6ECD3;color:#7B5C1B} .pill.gray{background:#EFEDE8;color:var(--muted)}

/* hero */
.hero{position:relative;border-radius:26px;padding:18px 18px 20px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 50% 0%,#3B4677 0%,#242B4A 58%,#181D33 100%);border:1px solid #2E365A}
.hero::before{content:"";position:absolute;inset:auto -10% -42% -10%;height:62%;background:radial-gradient(closest-side,#8F7BE055,#8F7BE000);pointer-events:none}
.hero .pill{background:#ffffff1f;color:#fff}.hero .lv{background:#323B66;border:1px solid #ffffff2e}.hero .bar{background:#ffffff1a;border-color:#ffffff33}.hero .next{background:#ffffff14;color:#fff}.hero .mname span{color:#C9BCF5}
.hero .stars i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
.lv{background:var(--navy);color:#fff;border-radius:14px;padding:6px 12px;text-align:center;line-height:1}
.lv small{display:block;font-size:10px;letter-spacing:.18em;opacity:.75;margin-bottom:3px}
.lv b{font-family:var(--display);font-size:26px}
.mon{width:min(62vw,250px);margin:2px auto 0;display:block;position:relative;animation:float 4s ease-in-out infinite}
.mon svg{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 10px #28314b22)}
@keyframes float{50%{transform:translateY(-7px)}}
.mname{text-align:center;position:relative}
.mname b{font-size:22px;font-weight:700}
.mname span{display:block;font-size:12px;letter-spacing:.16em;color:var(--lav-deep);font-weight:700}
.xp{margin-top:12px;position:relative}
.bar{height:14px;border-radius:999px;background:#fff;border:1px solid #D5CCEE;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lav-deep),var(--lav) 60%,var(--coral));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.xp-row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:6px;font-weight:600}
.next{margin-top:10px;background:#ffffffb8;border-radius:14px;padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:8px;position:relative}

/* evolution */
.hero .next.evo{width:100%;border:1px solid #FFD27A;background:#FFD27A2b;color:#fff;cursor:pointer;font:inherit;text-align:left}
.stones{position:relative;display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:12.5px;opacity:.9}

/* stats */
.stat{margin-top:10px}.stat:first-of-type{margin-top:0}.stat-h{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}.bar.sm{height:9px}

/* map */
.wmap{width:100%;max-width:560px;height:auto;display:block;margin:0 auto;border-radius:16px}
.wmap .zl{font-family:var(--display);font-size:14px;font-weight:700;fill:#28314B;paint-order:stroke;stroke:#FFF8E7;stroke-width:4px;stroke-linejoin:round}
.wmap .zk{font-size:10.5px;font-weight:600;fill:#4A4033;paint-order:stroke;stroke:#FFF8E7;stroke-width:3px;stroke-linejoin:round}
.wmap .mk{cursor:pointer}.wmap .mkn{font-size:9.5px;font-weight:700;fill:#28314B;paint-order:stroke;stroke:#FFF8E7;stroke-width:3px;stroke-linejoin:round}
.wmap .mkme{font-size:10.5px;font-weight:700;fill:#fff}

/* missions */
.mi{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.mi:first-of-type{border-top:0}
.chip{background:#EEF0F4;flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--navy)}
.a-vocab{background:#E7DFFB}.a-syntax{background:#D6EFE3}.a-grammar{background:#FDE3DA}.a-writing{background:#FBEBC8}.a-homework{background:#E3E8F5}.a-bookwriting{background:#F7E1EC}.a-bookquiz{background:#E2F0D9}.a-attend{background:#DDF2E4}.a-late{background:#FBE0DC}.a-good{background:#E1F0FA}.a-bad{background:#F9D6D6}.a-textbook{background:#FFF0C9}.a-book_reading{background:#DCEBFA}.a-book_syntax{background:#D6EFE3}.a-book_grammar{background:#FDE3DA}.a-book_writing{background:#FBEBC8}.a-book_vocab{background:#E7DFFB}.a-praise{background:#FCE7F3}.a-ar{background:#D8ECF3}.a-nelt{background:#E4E0F7}
#actRows .inp,#zoneRows .inp,#srRows .inp{min-height:36px;padding:6px 10px}#actRows td,#zoneRows td,#srRows td{vertical-align:middle}.a-challenge{background:var(--navy);color:#fff}.a-reading{background:#DDEFF6}
.mi .t{flex:1;min-width:0}
.mi .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.mi .t span{font-size:12.5px;color:var(--muted)}
.xpv{font-family:var(--display);font-weight:700;color:var(--lav-deep);white-space:nowrap}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13.5px;text-align:center}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:112px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11.5px;color:var(--muted)}
.week i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--lav);min-height:4px}
.week .today i{background:var(--lav-deep)} .week .today{color:var(--ink);font-weight:700}
.week em{font-style:normal;font-size:11px;font-family:var(--display);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--cream);border-radius:14px;padding:10px;text-align:center}
.kpi b{font-family:var(--display);font-size:20px;display:block}
.kpi span{font-size:11.5px;color:var(--muted)}

/* badges / stage track */
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:7px 12px 7px 8px;font-size:13px;font-weight:600}
.badge i{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 20deg,var(--lav),var(--mint),var(--coral),var(--lav));display:grid;place-items:center}
.badge i::after{content:"";width:12px;height:12px;background:#fff;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.badge.off{opacity:.45;border-style:dashed}.badge.off i{background:#E6E2DA}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.track div{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding-top:12px;border-top:4px solid var(--line)}
.track .done{border-color:var(--mint)} .track .now{border-color:var(--navy);color:var(--ink)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fffdf8f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:150px;border:0;background:transparent;border-radius:14px;padding:9px 6px;font-weight:600;color:var(--muted);font-size:13.5px;position:relative}
.tabs button.on{background:var(--navy);color:#fff}
.tabs .dot{position:absolute;top:5px;right:16%;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:var(--navy);font-size:11px;display:grid;place-items:center;padding:0 4px}

/* dex */
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.dx{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px;text-align:center;width:100%}
.dx svg{width:100%;height:auto;max-width:130px}
.dx b{display:block;font-family:var(--display);letter-spacing:.06em}
.dx.on{border-color:var(--lav-deep);box-shadow:0 0 0 2px #B8A7E855}
.sil svg{filter:brightness(0) opacity(.16)}
.forms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:12px;font-weight:600}
.forms svg{width:100%;height:auto}
.egg{animation:wob 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .h{font-size:11.5px;color:var(--muted);font-weight:600}
.cal .d{aspect-ratio:1;border-radius:12px;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;gap:1px}
.cal .d em{font-style:normal;font-size:10.5px;font-family:var(--display);font-weight:700}
.cal .x1{background:#E9E2FB}.cal .x2{background:#CFC2F2}.cal .x3{background:var(--lav-deep);color:#fff}
.cal .td{outline:2px solid var(--navy)}

/* forms & tables */
.field{display:grid;gap:5px;font-size:13px;font-weight:600}
.field input,.field select,.inp{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;min-height:42px;width:100%;font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.sel td{background:#F6F1FF}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--lav-deep)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ck{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;min-height:40px}
.ck.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ttabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px}
.ttabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;white-space:nowrap;min-height:40px}
.ttabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ttabs em{font-style:normal;background:var(--coral);color:var(--navy);border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.st{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:18px;padding:10px 12px;text-align:left;width:100%}
.st svg{width:58px;height:58px;flex:none}
.st>span>b:first-child{display:block}
.note{background:#F3F7F4;border:1px solid #D9EADF;border-radius:14px;padding:10px 12px;font-size:13px;color:#2D5743}

/* modal / toast */
.ov{position:fixed;inset:0;background:#28314b99;display:grid;place-items:end center;z-index:50;padding:0}
.sheet{background:var(--cream);border-radius:24px 24px 0 0;width:min(100%,640px);max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{place-items:center;padding:20px}.sheet{border-radius:24px}}
.sheet h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;z-index:80;max-width:90vw;box-shadow:0 8px 24px #28314b40}
.toast.err{background:var(--coral-deep)}

/* login / starter */
.login{max-width:440px;margin:0 auto;padding:36px 16px 60px;display:grid;gap:16px}
.logo{text-align:center}
.logo h1{font-family:var(--display);font-size:34px;letter-spacing:.03em;line-height:1.05}
.logo p{letter-spacing:.34em;font-size:11px;font-weight:700;color:var(--lav-deep);margin-top:8px}
.trio{display:flex;justify-content:center;margin:6px 0 -6px}
.trio svg{width:31%;max-width:130px;height:auto}
.starters{display:grid;gap:12px}
@media(min-width:680px){.starters{grid-template-columns:repeat(3,1fr)}}
.sc{border:2px solid var(--line);background:#fff;border-radius:22px;padding:14px;text-align:center}
.sc.on{border-color:var(--navy);box-shadow:0 6px 0 var(--navy)}
.sc svg{width:70%;max-width:170px;height:auto}
.sc b{font-family:var(--display);font-size:20px;letter-spacing:.08em;display:block}

/* evolution overlay */
.evo{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#131829;animation:evin .7s ease both;color:#fff;text-align:center;overflow:hidden}
@keyframes evin{from{background:#13182900}}
.evo .ring{position:absolute;width:min(86vw,440px);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,#b8a7e866,#b8a7e800);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14);opacity:.7}}
.evo .box{position:relative;width:min(70vw,300px);aspect-ratio:1}
.evo .m{position:absolute;inset:0}
.evo .m svg{width:100%;height:100%}
.evo .old{animation:evold 2.4s ease forwards}
.evo .new{opacity:0;animation:evnew 4s ease forwards}
@keyframes evold{0%{filter:none}35%{filter:brightness(0) invert(1) drop-shadow(0 0 18px #fff)}70%{filter:brightness(0) invert(1) drop-shadow(0 0 28px #fff);transform:scale(.72);opacity:1}100%{filter:brightness(0) invert(1);transform:scale(1.25);opacity:0}}
@keyframes evnew{0%,52%{opacity:0;transform:scale(.7);filter:brightness(0) invert(1)}62%{opacity:1;transform:scale(1.12);filter:brightness(0) invert(1) drop-shadow(0 0 30px #fff)}76%{filter:brightness(3)}88%,100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 26px #b8a7e8aa)}}
.evo .pt{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff;opacity:0;animation:pt 2.2s ease-out infinite}
.evo .pt.s{clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);width:14px;height:14px;border-radius:0;background:var(--mint)}
@keyframes pt{0%{opacity:0;transform:rotate(var(--a)) translateX(20px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(1)}}
.evo .txt{position:absolute;left:0;right:0;bottom:11vh;padding:0 20px;opacity:0;animation:tx .6s 3.5s ease forwards}
@keyframes tx{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.evo .txt h2{font-family:var(--display);font-size:clamp(22px,6vw,34px);letter-spacing:.14em}
.evo .txt p{margin:8px 0 14px;color:#D9D2F3}
.evo .skip{position:absolute;top:16px;right:16px;background:#ffffff1f;border:1px solid #ffffff44;color:#fff;border-radius:12px;padding:8px 14px;font-weight:600}
.evo.done .old{animation:none;opacity:0}
.evo.done .new{animation:none;opacity:1;filter:drop-shadow(0 0 26px #b8a7e8aa)}
.evo.done .txt{animation:none;opacity:1}
.evo.done .pt,.evo.done .skip{display:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
.a2hs{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;max-width:520px;margin:0 auto;background:#fff;border:1px solid #D9DDEE;border-radius:16px;box-shadow:0 10px 30px #1f274733;padding:14px 16px;display:flex;flex-direction:column;gap:6px;color:#1F2747}.a2hs>span{font-size:14px;color:#4a5275;line-height:1.5}.a2hs .row{justify-content:flex-end;gap:8px;margin-top:4px}
.cave-entry{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;background:#2B2F45;color:#fff;border:0}
.cave-entry b{font-size:17px}.cave-entry span{color:#C9CFEA;font-size:13px}

/* ================= 몬스터 아트 (임시 SVG · 교체 가능) =================
   mw_species.forms[n].image_url 에 이미지 주소를 넣으면 해당 형태는 그 이미지로 표시됩니다. */
function markShape(t,x,y,z,fill){
  const P={flame:`M0,-10 C6,-4 8,2 4,8 C2,10 -2,10 -4,8 C-8,3 -5,-2 -2,-4 C-2,-7 -1,-9 0,-10Z`,
    star:`M0,-10 L3,-3 L10,-3 L4.5,2 L6.5,9 L0,5 L-6.5,9 L-4.5,2 L-10,-3 L-3,-3Z`,
    leaf:`M0,-10 C8,-6 8,5 0,10 C-8,5 -8,-6 0,-10Z M0,-6 L0,7`,
    drop:`M0,-10 C6,-2 8,3 5,7 C2,10 -2,10 -5,7 C-8,3 -6,-2 0,-10Z`,
    cloud:`M-8,4 a5,5 0 0 1 2,-9 a6,6 0 0 1 11,1 a4.5,4.5 0 0 1 2,8Z`,
    stone:`M-7,-4 L0,-9 L7,-4 L7,5 L0,9 L-7,5Z`,
    quill:`M-7,9 C-6,-2 0,-9 8,-10 C7,-2 2,5 -4,7Z M-7,9 L1,-1`,
    snow:`M0,-10 L0,10 M-9,-5 L9,5 M-9,5 L9,-5`};
  const stroke=(t==='snow'||t==='leaf'||t==='quill')?` stroke="${t==='snow'?fill:'#ffffffaa'}" stroke-width="${t==='snow'?2.4:1.2}" stroke-linecap="round"`:'';
  return `<path transform="translate(${x},${y}) scale(${z})" d="${P[t]||P.star}" fill="${t==='snow'?'none':fill}"${stroke}/>`;
}
function monsterSVG(sp,stage,o={}){
  const form=(sp.forms||[]).find(f=>f.stage===stage);
  if(form&&form.image_url) return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(sp.name)}"><image href="${esc(form.image_url)}" width="200" height="200"/></svg>`;
  const c=sp.art||{},s=stage,B=c.body||'#ccc',L=c.belly||'#fff',A=c.accent||'#888',D=c.dark||'#555';
  const hy=[0,98,86,76][s],hr=[0,45,42,40][s],by=[0,146,140,136][s],bx=[0,34,40,46][s],bh=[0,26,36,46][s],ez=[0,1,1.12,1.28][s];
  let g='';
  if(s===3){g+=`<circle cx="100" cy="104" r="92" fill="${A}" opacity=".16"/><circle cx="100" cy="104" r="74" fill="${A}" opacity=".14"/>`;
    for(const[x,y,z]of[[24,48,.7],[176,58,.9],[30,150,.6],[172,146,.7],[100,12,.8]])g+=markShape('star',x,y,z,A);}
  // tail
  const tx=100+bx-6,ty=by+4;
  if(c.tail==='fox'){const n=s===3?2:1;for(let i=0;i<n;i++){const r=i?-22:0;g+=`<g transform="rotate(${r} ${tx} ${ty})"><path d="M${tx},${ty} C${tx+34*ez},${ty+6} ${tx+46*ez},${ty-30*ez} ${tx+26*ez},${ty-52*ez} C${tx+22*ez},${ty-34*ez} ${tx+8},${ty-22} ${tx-4},${ty-14}Z" fill="${B}"/><path d="M${tx+26*ez},${ty-52*ez} C${tx+38*ez},${ty-40*ez} ${tx+36*ez},${ty-26*ez} ${tx+28*ez},${ty-22*ez} C${tx+26*ez},${ty-32*ez} ${tx+24*ez},${ty-40*ez} ${tx+26*ez},${ty-52*ez}Z" fill="${L}"/></g>`}}
  else if(c.tail==='cat'){g+=`<path d="M${tx},${ty+6} C${tx+30*ez},${ty+8} ${tx+40*ez},${ty-20*ez} ${tx+24*ez},${ty-40*ez}" fill="none" stroke="${B}" stroke-width="${9+s}" stroke-linecap="round"/>`;if(s>=2)g+=markShape('star',tx+24*ez,ty-42*ez,.5+s*.18,A)}
  else if(c.tail==='puff'){g+=`<circle cx="${tx+8}" cy="${ty+2}" r="${9+s*2.5}" fill="${L}"/>`}
  else if(c.tail==='drop'){g+=`<path d="M${tx-4},${ty+8} C${tx+30*ez},${ty+14} ${tx+44*ez},${ty-4} ${tx+50*ez},${ty-20*ez} C${tx+30*ez},${ty-12} ${tx+10},${ty-10} ${tx-6},${ty-6}Z" fill="${D}"/>`}
  // master: wings / cape
  if(s===3){g+=`<path d="M${100-bx+6},${by-14} C${100-bx-34},${by-40} ${100-bx-40},${by+4} ${100-bx-22},${by+22} C${100-bx-16},${by+6} ${100-bx-6},${by} ${100-bx+8},${by+2}Z" fill="${A}"/><path d="M${100+bx-6},${by-14} C${100+bx+34},${by-40} ${100+bx+40},${by+4} ${100+bx+22},${by+22} C${100+bx+16},${by+6} ${100+bx+6},${by} ${100+bx-8},${by+2}Z" fill="${A}"/>`}
  // feet + body
  g+=`<ellipse cx="${100-bx*.5}" cy="${by+bh-3}" rx="${10+s*1.5}" ry="7" fill="${D}"/><ellipse cx="${100+bx*.5}" cy="${by+bh-3}" rx="${10+s*1.5}" ry="7" fill="${D}"/>`;
  g+=`<ellipse cx="100" cy="${by}" rx="${bx}" ry="${bh}" fill="${B}"/><ellipse cx="100" cy="${by+bh*.18}" rx="${bx*.62}" ry="${bh*.68}" fill="${L}"/>`;
  if(s>=2)g+=`<ellipse cx="${100-bx+3}" cy="${by-2}" rx="8" ry="${12+s*2}" fill="${B}" transform="rotate(18 ${100-bx+3} ${by-2})"/><ellipse cx="${100+bx-3}" cy="${by-2}" rx="8" ry="${12+s*2}" fill="${B}" transform="rotate(-18 ${100+bx-3} ${by-2})"/>`;
  if(s===3)g+=markShape(c.mark,100,by+bh*.2,1.25,A);
  // ears
  const ear=(sx)=>{const x=100+sx*hr*.62,t=c.ears;
    if(t==='fox')return `<path d="M${x-sx*hr*.34},${hy-hr*.55} L${x+sx*hr*.22},${hy-hr*(1.05+.42*ez)} L${x+sx*hr*.36},${hy-hr*.42}Z" fill="${B}"/><path d="M${x-sx*hr*.16},${hy-hr*.62} L${x+sx*hr*.18},${hy-hr*(.9+.36*ez)} L${x+sx*hr*.24},${hy-hr*.56}Z" fill="${D}"/>`;
    if(t==='cat')return `<path d="M${x-sx*hr*.36},${hy-hr*.6} L${x+sx*hr*.12},${hy-hr*(.95+.3*ez)} L${x+sx*hr*.36},${hy-hr*.4}Z" fill="${B}"/><path d="M${x-sx*hr*.18},${hy-hr*.66} L${x+sx*hr*.1},${hy-hr*(.86+.24*ez)} L${x+sx*hr*.22},${hy-hr*.56}Z" fill="${L}"/>`;
    if(t==='bunny'){const cx=100+sx*hr*.36,cy=hy-hr*(.95+.34*ez);return `<ellipse cx="${cx}" cy="${cy}" rx="${hr*.2}" ry="${hr*(.44+.2*ez)}" fill="${B}" transform="rotate(${sx*(s===1?16:8)} ${cx} ${hy-hr*.7})"/><ellipse cx="${cx}" cy="${cy+2}" rx="${hr*.1}" ry="${hr*(.3+.16*ez)}" fill="${L}" transform="rotate(${sx*(s===1?16:8)} ${cx} ${hy-hr*.7})"/>`}
    if(t==='round')return `<circle cx="${100+sx*hr*.74}" cy="${hy-hr*.68}" r="${hr*.26*ez}" fill="${B}"/><circle cx="${100+sx*hr*.74}" cy="${hy-hr*.68}" r="${hr*.13*ez}" fill="${D}"/>`;
    if(t==='horn')return `<circle cx="${100+sx*hr*.86}" cy="${hy-hr*.3}" r="${hr*.24*ez}" fill="none" stroke="${A}" stroke-width="${5+s}"/><ellipse cx="${100+sx*hr*.98}" cy="${hy+hr*.05}" rx="${hr*.2}" ry="${hr*.11}" fill="${D}"/>`;
    if(t==='antler'){const ax=100+sx*hr*.42,ay=hy-hr*.82,h=hr*(.5+.3*ez);return `<path d="M${ax},${ay} L${ax+sx*6},${ay-h} M${ax+sx*2},${ay-h*.4} L${ax+sx*18},${ay-h*.7} ${s>=2?`M${ax+sx*4},${ay-h*.72} L${ax-sx*8},${ay-h*1.02}`:''} ${s===3?`M${ax+sx*12},${ay-h*.6} L${ax+sx*20},${ay-h*1.05}`:''}" fill="none" stroke="${A}" stroke-width="${3.5+s*.6}" stroke-linecap="round"/><ellipse cx="${100+sx*hr*.86}" cy="${hy-hr*.5}" rx="${hr*.2}" ry="${hr*.1}" fill="${B}" transform="rotate(${sx*-24} ${100+sx*hr*.86} ${hy-hr*.5})"/>`}
    if(t==='owl')return `<path d="M${100+sx*hr*.4},${hy-hr*.78} L${100+sx*hr*(.98+.1*ez)},${hy-hr*(1.02+.22*ez)} L${100+sx*hr*.86},${hy-hr*.4}Z" fill="${B}"/>`;
    return ''};
  g+=ear(-1)+ear(1);
  // head + face
  g+=`<circle cx="100" cy="${hy}" r="${hr}" fill="${B}"/>`;
  if(c.ears==='owl')g+=`<circle cx="${100-hr*.4}" cy="${hy}" r="${hr*.36}" fill="${L}"/><circle cx="${100+hr*.4}" cy="${hy}" r="${hr*.36}" fill="${L}"/>`;
  else g+=`<ellipse cx="100" cy="${hy+hr*.36}" rx="${hr*.56}" ry="${hr*.42}" fill="${L}"/>`;
  if(c.ears==='horn')g+=`<circle cx="${100-hr*.3}" cy="${hy-hr*.78}" r="${hr*.24}" fill="${L}"/><circle cx="100" cy="${hy-hr*.9}" r="${hr*.28}" fill="${L}"/><circle cx="${100+hr*.3}" cy="${hy-hr*.78}" r="${hr*.24}" fill="${L}"/>`;
  const ex=hr*.4,ey=hy+hr*.02,er=[0,hr*.15,hr*.14,hr*.13][s];
  for(const sx of[-1,1]){g+=`<ellipse cx="${100+sx*ex}" cy="${ey}" rx="${er}" ry="${er*(s===1?1:1.18)}" fill="#28314B"/><circle cx="${100+sx*ex+er*.35}" cy="${ey-er*.4}" r="${er*.36}" fill="#fff"/>`;
    if(s>=2)g+=`<path d="M${100+sx*(ex-er*1.5)},${ey-er*1.5} L${100+sx*(ex+er*1.3)},${ey-er*2.1}" stroke="${D}" stroke-width="3" stroke-linecap="round"/>`}
  if(c.ears==='owl')g+=`<path d="M100,${hy+hr*.12} l-5,7 l5,5 l5,-5Z" fill="${A}"/>`;
  else g+=`<ellipse cx="100" cy="${hy+hr*.24}" rx="3.6" ry="2.6" fill="#28314B"/><path d="M${100-7},${hy+hr*.36} Q100,${hy+hr*.52} ${100+7},${hy+hr*.36}" fill="none" stroke="#28314B" stroke-width="2" stroke-linecap="round"/>`;
  if(s>=2)g+=markShape(c.mark,100,hy-hr*.58,s===3?1.05:.8,A);
  // explorer scarf / master collar
  if(s===2)g+=`<path d="M${100-bx*.8},${by-bh*.72} Q100,${by-bh*.4} ${100+bx*.8},${by-bh*.72} L${100+bx*.7},${by-bh*.46} Q100,${by-bh*.12} ${100-bx*.7},${by-bh*.46}Z" fill="${A}"/><path d="M${100+bx*.4},${by-bh*.4} l10,20 l-13,-3Z" fill="${A}"/>`;

  return `<svg viewBox="0 0 200 200" role="img" aria-label="${esc(sp.name)} ${STN[s]}">${g}</svg>`;
}

/* ================= 연출: 진화 · 발견 ================= */
function reveal({oldSvg,newSvg,title,sub}){return new Promise(res=>{
  const fx=$('#fx');let pts='';for(let i=0;i<26;i++)pts+=`<i class="pt${i%3===0?' s':''}" style="--a:${Math.round(360/26*i)}deg;--d:${110+Math.round(Math.random()*90)}px;animation-delay:${(Math.random()*1.8).toFixed(2)}s"></i>`;
  fx.innerHTML=`<div class="evo"><div class="ring"></div><div class="box"><div class="m old">${oldSvg}</div><div class="m new">${newSvg}</div>${pts}</div>
   <button class="skip" id="evskip">건너뛰기</button>
   <div class="txt"><h2>${esc(title)}</h2><p>${sub}</p><button class="btn" id="evok" style="color:#28314B">계속하기</button></div></div>`;
  const el=fx.firstChild,done=()=>el.classList.add('done');
  const tm=setTimeout(done,4300);
  $('#evskip').onclick=()=>{clearTimeout(tm);done()};
  $('#evok').onclick=()=>{clearTimeout(tm);fx.innerHTML='';res()};
})}

 ['flamy','FLAMY','불꽃 여우','용기와 도전','starter',null,{body:'#F2A65A',belly:'#FFF3DC',accent:'#E8743B',dark:'#B5522A',ears:'fox',tail:'fox',mark:'flame'}],

  streakInfo(s){const cfg=this.st.set.streak_rewards||{},out={},B=Date.UTC(2024,0,1),dn=d=>(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-B)/864e5;
